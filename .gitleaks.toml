# gitleaks 配置：沿用默认规则，只放行测试夹具里的示例假凭据。
# 新增放行项请写具体的假值，不要按整类规则或整个目录放行。
title = "LULUX ETA gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "测试 / 端到端夹具中的示例假凭据（非真实密钥），只按具体假值放行"
