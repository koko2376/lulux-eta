regexes = [
  '''^Owner-pass-2026$''',
  '''^tvly-secret-123456$''',
  '''^sk-test-1234567890$''',
  '''^ghp_ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$''',
]
